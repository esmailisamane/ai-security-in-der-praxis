[project]
name = "shopfix"
version = "0.1.0"
description = "ShopFix v0 – der Support-Bot aus dem Kurs AI Security in der Praxis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.5",
    "ollama>=0.6.3",
    "tokenizers>=0.23.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest]
testpaths = ["tests"]
markers = ["modell: fragt das echte Modell (langsam, Ergebnis schwankt)"]
